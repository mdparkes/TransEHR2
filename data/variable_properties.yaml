# Features are listed by name in the data files to be processed.
# `type` can be `numeric`, `categorical`, `ordinal`, `multilabel`, or `text`.
# `size` is the number of values for each feature (typically just one for a single text string), for example, a categorical feature with three categories would have size 3 to reflect the one-hot encoding of the feature.
# `category_map` is a mapping from one-hot indices to the original category values, for example, a categorical feature with three categories (0, 1, 2) would have a category map of {0: 'Other', 1: 'F', 2: 'M'}.
