[pytest]
# Registers the one custom marker in the suite, so `-m "not slow"` works and pytest stops
# warning that it might be a typo.
#
# 'slow' marks a test that trains a model rather than checking a shape or a file. There are two,
# both in tests/test_phase2_infrastructure.py, and together they take about half a minute on a
# laptop CPU. They are not deselected by default -- they are the ones that would catch a broken
# Phase 2 pipeline, and half a minute is worth paying every run.
#
#   pytest tests/ -m "not slow"    skip them
#   pytest tests/ -m slow          run only them
markers =
    slow: trains a model; slower than a unit test but still under a minute
