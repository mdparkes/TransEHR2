# Phase 3 pre-admission history sweep: one arm, six history lengths, mortality on fold0.
#
# Expand with:
#     python generate_tuning_configs.py TransEHR2/configs/experiments/tuning/phase3_spec.yaml
#
# BASE_CONFIG is phase3_base.yaml, which carries the encoding arm and the five hyperparameters
# Phase 2 settled. It is in the repository beside this spec, and each of its values has a
# decision record in this directory: phase2a_additive_cell.yaml for the schedules,
# phase2c_additive_selection.yaml for the masking ratios and the time loss weight.
#
# The sweep is the same additive shape as Phase 2 with a grid of one, so it needs no new
# machinery and no new SLURM scripts -- the same manifest-driven arrays run it:
#     python tuning_trial.py <manifest> --stage pretrain  --count   ->  7
#     python tuning_trial.py <manifest> --stage finetune  --count   ->  7
# Every trial is selected on mortality, so every pretrain has a finetune. Fourteen runs in two
# stages, seven wide, against a suggested %8 throttle that therefore never binds.

SPEC_NAME: phase3

BASE_CONFIG: phase3_base.yaml
DATASET_CONFIG: ../../datasets/mimic4.yaml
OUTPUT_DIR: phase3
MANIFEST: phase3_manifest.yaml

# The same tuning fold as Phase 2, and for the same reason: fold0 is held out of the manuscript
# results, so decisions made on it do not contaminate them.
FOLD: fold0

# One arm. Everything that defines it -- POSITION_ENCODING and the five tuned hyperparameters --
# already sits in the assembled base config, so the arm adds nothing of its own. The name is
# what appears in trial directories and in the tables.
ARMS:
  tuned: {}

ALIASES:
  HISTORY_LEN_STEPS: hist

# History reaches only the value encoder, so the value stream alone is the binding count, and
# that distribution is far too skewed for evenly spaced step counts to say anything: most
# episodes are settled by a very short cap, which would leave the last arm carrying nearly all
# of the records removed and every arm above it differing from its neighbour by almost nothing.
# The arms are therefore spaced by history *record mass* rather than by step count, at roughly
# even quintiles.
#
# The lengths are measured, not chosen. `choose_history_cutpoints.py` sums the observed
# value-stream timesteps inside the most recent L steps of the history region over this spec's
# cohort and fold, and returns the L at which that total crosses each equal share. Re-run it
# and repaste the block whenever the extraction changes -- the value feature set and the
# pre-admission boundary both move the curve, so the cutpoints do not survive a re-extraction.
#
# Measured on fold0 over any_history: 1,132,754 records, 41,146 of them carrying text.
#
#     arm    records retained   share   dropped by this step
#     500           1,132,754   1.000   --
#     261             905,870   0.800   226,884   0.200
#     140             678,761   0.599   227,109   0.200
#      70             451,799   0.399   226,962   0.200
#      26             225,495   0.199   226,304   0.200
#       0                   0   0.000   225,495   0.199
#
# Text records do not fall at the same rate -- 0.916 of them survive the first crop against
# 0.800 of all records, and half remain at the shortest arm -- because a text record sits at a
# recent timestep more often than a value record does. An arm therefore removes proportionally
# more non-text history than text history, which is worth stating before the sweep's curve is
# read as a statement about text.
#
# 500 is the extraction capacity (MAX_HISTORY_LEN_STEPS in the dataset config), so it is
# censoring rather than a natural maximum: the episodes sitting at the cap have an unknown true
# history length. It is the centre here because it is the no-crop condition.
#
# 0 is a genuine arm rather than a degenerate one: `history_len_steps=0` resolves to a crop
# window starting at MAX_HISTORY_LEN_STEPS, which keeps the peri-stay episode intact and
# removes pre-admission history alone.
#
# Report every arm on the subset it actually affects rather than on the full cohort, where the
# differences dilute to nothing. The longest crop is weak on episode count but completes the
# dose-response curve.
GRID:

  HISTORY_LEN_STEPS:
    values: [500, 261, 140, 70, 26, 0]
    select_on: mortality

# ------------------------------------------------------------------------------------------
# Ablation, riding along in the idle slots
# ------------------------------------------------------------------------------------------
#
# NOTE ON DIRECTION. The revision plan proposes this the other way round -- run a *narrowed*
# event ladder against a shared one -- but that is stale. The narrowed event ladder already
# landed: every config carries EVENT_LADDER_P_MAX = 6048 (~63 x 96 h) against the value
# stream's 8.05e6, and TransEHR2/test_rope_encoding.py asserts the resulting band counts. The
# differentiated ladder is the default, so the missing half of the comparison is the shared
# one, and that is what this trial runs.
#
# What it tests: after fix 03 the event encoder sees only the peri-stay region, so its gaps
# span at most 96 h -- PREADMISSION_CUTOFF_HOURS before admission through
# MAX_EPISODE_LEN_HOURS after it -- while the value encoder still spans five orders of
# magnitude. Matching the ladder to the narrower range buys ~55 informative bands per scale
# against ~29 under the value ladder, a 1.9x gain in effective temporal resolution. That is
# a prediction, not a measurement, and this is the run that measures it.
#
# Why it is free: the sweep is 6 wide in each of two stages against an 8-wide node, so a
# seventh trial fills an idle slot in each. Fourteen runs instead of twelve, same two stages,
# same critical path. It does cost the two allocations themselves -- free in wall clock, not
# in GPU hours.
EXTRA_TRIALS:

  - name: sharedladder
    arm: tuned
    select_on: mortality
    overrides:
      # Must equal VALUE_LADDER_P_MAX in the base config, which is what makes the ladder
      # shared. A literal rather than a reference, so it has to be updated whenever that
      # bound is re-derived; test_ablation_puts_the_event_stream_on_the_value_ladder fails
      # if the two drift apart.
      EVENT_LADDER_P_MAX: 8.05e+6
    description: >
      Event stream on the value stream's ladder, against the centre's differentiated one.
      Identical to the centre in every other respect, including HISTORY_LEN_STEPS = 500, so
      the pair is a head-to-head on the same fold and the same task. No retuning: the ladder
      is a frozen buffer and changing its span does not touch the optimizer setup.
