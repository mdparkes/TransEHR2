# Phase 2 hyperparameter sweep: both encoding arms, five hyperparameters, one shared centre.
#
# Expand with:
#     python generate_tuning_configs.py TransEHR2/configs/experiments/tuning/phase2_spec.yaml
#
# The sweep is additive rather than factorial: every tested value is paired against every other
# hyperparameter's default. Five hyperparameters at three values each is therefore
#     1 centre + 5 x 2 non-default values = 11 configurations per arm, 22 in total,
# not 3^5. The centre is run once per arm and serves as the reference point for all five.
#
# Both arms get the complete sweep from one shared centre, rather than tuning the learning rate
# first and everything else on the winner. Nothing is chained, so all 22 pretrains are mutually
# independent and pack the node three deep; the sequential version needed the same three
# pretrain stages but could only fill two of them, because the second group had to wait on the
# encoding decision. Same wall-clock, twelve more runs.

SPEC_NAME: phase2

BASE_CONFIG: phase2_base.yaml
DATASET_CONFIG: ../../datasets/mimic4.yaml
OUTPUT_DIR: phase2
MANIFEST: phase2_manifest.yaml

# fold0 is held out of the manuscript results precisely so that tuning can use it without
# contaminating them.
FOLD: fold0

# The two encoding arms. Each entry is the set of config keys that defines the arm; everything
# else comes from the base config, so the arms are identical in all other respects. Both run
# the same frozen, re-spanned ladder -- what differs is only whether the gap reaches the
# attention score by rotation or the embedding by addition.
#
# The inherited 1e4 ladder is not run as a third arm. At the largest observed gap none of its
# 128 bands stays phase-coherent, so it would handicap the history arm and not the in-stay
# control -- a directional bias toward the paper's own null result rather than a neutral
# baseline.
ARMS:
  additive:
    POSITION_ENCODING: 'additive'
  rope:
    POSITION_ENCODING: 'rope'

# Short tokens used in trial names, which become directory names under models/, log/ and
# checkpoints/. Without these the names would carry the full hyperparameter key.
ALIASES:
  PRETRAIN_LEARNING_RATE: lr
  PRETRAIN_LEARNING_RATE_DECAY: decay
  CMPNT_MASK_RATIO: cmask
  RECORD_MASK_RATIO: rmask
  THP_PRED_LOSS_TIME_WT: timewt

# The grid. The FIRST value of each entry is the default: it is what the shared centre runs and
# what every other hyperparameter is held at while this one varies.
#
# `select_on` is not a free choice. It follows from what the hyperparameter does to the
# objective. Learning rate and decay leave the pretraining loss intact, so that loss ranks them
# and no finetune is needed. The two masking ratios and the time weight rescale the objective,
# so their pretraining losses are not comparable to one another -- a model masked at 0.75 is
# solving a harder problem than one masked at 0.25, and "lowest loss wins" would pick the
# easiest task. Those three are selected on mortality validation performance instead, which is
# why seven of the eleven trials per arm are also finetuned.
GRID:

  # 0.002 is not in the grid. Held for a full run it diverged in nine of the fourteen trials
  # that carried it, in both arms and under four different hyperparameters, while none of the
  # seven trials at a lower sustained rate that ran to completion diverged. The centre has to be stable for an
  # additive sweep to mean anything, because every other arm inherits it.
  #
  # The replacement spans a decade in half-decade steps around a centre that did not diverge.
  # A divergence inside this arm is self-limiting: it reaches no other trial, because the other
  # arms run at the centre. It does contaminate this arm's own ranking, though. `select_on:
  # pretrain` reads the best epoch, and a rate that diverges late can still post a lower best
  # than a stable one did before it went. Rank on the stable trials only.
  PRETRAIN_LEARNING_RATE:
    values: [0.0002, 0.0006, 0.00006]
    select_on: pretrain

  PRETRAIN_LEARNING_RATE_DECAY:
    values: [0.90, 0.80, 0.50]
    select_on: pretrain

  CMPNT_MASK_RATIO:
    values: [0.25, 0.5, 0.75]
    select_on: mortality

  # Xu et al.'s 0.15 was inherited and has never been tuned, and it has the widest reach of the
  # masking hyperparameters: feature_sample_rate goes to the event-stream masker as well as the
  # value-stream one, where CMPNT_MASK_RATIO only bites on text.
  RECORD_MASK_RATIO:
    values: [0.15, 0.25, 0.35]
    select_on: mortality

  # Worth watching rather than pre-empting: with MSE targets at O(1), weight 0.01 puts the time
  # term an order of magnitude below the type loss and 0.0001 switches it off in all but name.
  # If the sweep comes back flat, the informative direction is UP toward parity (0.1, 1.0), not
  # further down.
  THP_PRED_LOSS_TIME_WT:
    values: [0.01, 0.001, 0.0001]
    select_on: mortality
