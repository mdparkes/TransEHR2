# Phase 2c: the masking ratios and the time weight, on the settled encoding and schedules.
#
# THIS SPEC DEPENDS ON PHASES 2a AND 2b HAVING FINISHED. BASE_CONFIG below is not in the
# repository: it is the encoding and the two schedules those phases selected, assembled into
# one config. Phase 2a's selection already carries the pretraining side, so the finetuning
# rate and half-life Phase 2b chose are added to it:
#
#     python -c "import yaml; c = yaml.safe_load(open( \
#         'TransEHR2/configs/experiments/tuning/phase2b_additive_base.yaml')); \
#         c.update({'FINETUNE_LEARNING_RATE': 1.0e-5, 'FINETUNE_LR_HALF_LIFE': 160, \
#                   'EXPERIMENT_NAME': 'phase2c_base'}); \
#         yaml.safe_dump(c, open( \
#         'TransEHR2/configs/experiments/tuning/phase2c_base.yaml', 'w'))"
#
# Running the generator before that file exists fails with a message saying so, rather than
# quietly sweeping these three against untuned settings.
#
# Expand with:
#     python generate_tuning_configs.py TransEHR2/configs/experiments/tuning/phase2c_spec.yaml
#
# The design is additive, not factorial. These three are plausibly interacting -- two of them
# are masking ratios -- but a cross product is 27 cells against the additive 7, and at this
# task's measured noise more cells buys no power and more selection bias: the maximum of 27
# noisy draws is further above the truth than the maximum of 7. Where a difference is small
# relative to run-to-run spread, replication of few configurations dominates enumeration of
# many.

SPEC_NAME: phase2c

BASE_CONFIG: phase2c_base.yaml
DATASET_CONFIG: ../../datasets/mimic4.yaml
OUTPUT_DIR: phase2c
MANIFEST: phase2c_manifest.yaml

# fold0 is held out of the manuscript results precisely so that tuning can use it without
# contaminating them.
FOLD: fold0

# One arm. The encoding comparison is finished: the two were not separated by the paired
# head-to-head, so the additive encoding is carried forward as the submitted one.
ARMS:
  additive:
    POSITION_ENCODING: 'additive'

# Short tokens used in trial names, which become directory names under models/, log/ and
# checkpoints/.
ALIASES:
  CMPNT_MASK_RATIO: cmask
  RECORD_MASK_RATIO: rmask
  THP_PRED_LOSS_TIME_WT: timewt

# All three rescale the pretraining objective, so their pretraining losses are not comparable
# to one another -- a model masked at 0.75 is solving a harder problem than one masked at 0.25,
# and "lowest loss wins" would pick the easiest task. They are selected on mortality validation
# performance instead, which is why every trial here is finetuned as well as pretrained.
GRID:

  CMPNT_MASK_RATIO:
    values: [0.25, 0.5, 0.75]
    select_on: mortality

  # Xu et al.'s 0.15 was inherited and has never been tuned, and it has the widest reach of the
  # masking hyperparameters: feature_sample_rate goes to the event-stream masker as well as the
  # value-stream one, where CMPNT_MASK_RATIO only bites on text.
  RECORD_MASK_RATIO:
    values: [0.15, 0.25, 0.35]
    select_on: mortality

  # With MSE targets at O(1), weight 0.01 puts the time term an order of magnitude below the
  # type loss and 0.0001 switches it off in all but name. If the sweep comes back flat, the
  # informative direction is UP toward parity (0.1, 1.0), not further down.
  THP_PRED_LOSS_TIME_WT:
    values: [0.01, 0.001, 0.0001]
    select_on: mortality
