# Base configuration for the Phase 2 hyperparameter sweep.
#
# This is a complete, runnable experiment config sitting at the sweep's centre: every tuned
# hyperparameter is at the first value of its grid. generate_tuning_configs.py copies it once
# per trial and overrides EXPERIMENT_NAME, POSITION_ENCODING and the one hyperparameter that
# trial is testing. The grid itself lives in phase2_spec.yaml, not here.
#
# Every key a trial can override has to be present here. That is checked at generation time,
# because a key that is absent from the base would fall through to the code default and the
# sweep would silently test nothing.

EXPERIMENT_NAME: "phase2_base"

BATCH_SIZE: 200

# Tuning runs against the fully featured model -- text and pre-admission history both on --
# because that is the configuration whose hyperparameters the manuscript needs.
USE_TEXT: True
USE_HISTORICAL_RECORDS: True

# Runtime sequence-length caps, applied by cropping the extracted arrays at load time.
# `null` uses every timestep that was extracted. Phase 3 sweeps HISTORY_LEN_STEPS; Phase 2
# leaves both uncapped so the tuned values are not conditioned on a truncation.
HISTORY_LEN_STEPS: null
EPISODE_LEN_STEPS: null

# Whether to let the generator and discriminator predict feature presence indicators as well
# as values
PREDICT_INDICATORS: False

# Temporal encoding arm, applied to the value and event encoders alike.
#   'additive' -- TemporalPositionEncoding added to the embedding, as submitted.
#   'rope'     -- the same ladder rotated into q and k instead, so the score depends on the gap.
# Overridden per arm by the spec's ARMS block; the value here is the one the base runs alone.
#
# Both arms run the same frozen ladder, spaced log-uniformly in period between P_MIN and P_MAX.
# The bounds follow the informative-band criterion 0.1 <= gap/lambda <= pi, which in periods is
# P_MIN = 2 * gap_min and P_MAX ~ 63 * gap_max.
#   Value stream: gaps 1 - 127,829 h (history included).  Event stream: 1 - 48 h, in-stay only.
# 127,829 h is measured on the re-extracted arrays and is a censored maximum, not the 500-step
# cap. Re-measure and re-derive both bounds after any re-extraction.
POSITION_ENCODING: 'additive'
VALUE_LADDER_P_MIN: 2.0
VALUE_LADDER_P_MAX: 8.05e+6  # 63 x 127,829 h. yaml 1.1 needs the sign, or this parses as a
                             # string, and a string reaches the ladder builder as a bad bound
EVENT_LADDER_P_MIN: 2.0
EVENT_LADDER_P_MAX: 3000.0

GENERATOR_ENCODER_D_MODEL: 256
GENERATOR_ENCODER_N_HEADS: 2
GENERATOR_ENCODER_N_ENCODER_BLOCKS: 1
GENERATOR_ENCODER_DIM_FEEDFORWARD: 256
GENERATOR_ENCODER_DROPOUT: 0.1
GENERATOR_ENCODER_ACTIVATION: 'gelu'
GENERATOR_ENCODER_NORM: 'LayerNorm'
GENERATOR_ENCODER_NORM_FIRST: True

DISCRIMINATOR_ENCODER_D_MODEL: 256
DISCRIMINATOR_ENCODER_N_HEADS: 2
DISCRIMINATOR_ENCODER_N_ENCODER_BLOCKS: 1
DISCRIMINATOR_ENCODER_DIM_FEEDFORWARD: 256
DISCRIMINATOR_ENCODER_DROPOUT: 0.1
DISCRIMINATOR_ENCODER_ACTIVATION: 'gelu'
DISCRIMINATOR_ENCODER_NORM: 'LayerNorm'
DISCRIMINATOR_ENCODER_NORM_FIRST: True

THP_ENCODER_D_MODEL: 256
THP_ENCODER_D_INNER: 256
THP_ENCODER_N_LAYERS: 1
THP_ENCODER_N_HEADS: 2
THP_ENCODER_D_K: 128  # = d_model/2, so RoPE gets n_head*d_k/2 = 128 bands, matching TPE
                      # d_v stays 64: only q and k are rotated, so only their width sets the ladder
THP_ENCODER_D_V: 64
THP_ENCODER_DROPOUT: 0.1
THP_ENCODER_NORM_FIRST: True

GENERATOR_D_MODEL: 256
GENERATOR_DIM_FEEDFORWARD: 256

DISCRIMINATOR_DIM_FEEDFORWARD: 256

PREDICTOR_AGGREGATION_METHOD: "mean"

MODEL_DIR: "/uhome/pr3/projects/p60290_2/TransEHR2/models"

# Tuning budget. Early stopping fires after 30 epochs without improvement, so this is a
# ceiling rather than a target. The final runs get 1000; selecting under a shorter budget and
# applying the result to a longer one is standard practice but is worth a line in the methods,
# particularly for the decay, which is the hyperparameter most sensitive to run length.
PRETRAIN_TOTAL_EPOCH: 200

FINETUNE_LEARNING_RATE: 0.0002
FINETUNE_TOTAL_EPOCH: 500
FINETUNE_LEARNING_RATE_DECAY: 0.9

# Tasks whose binary cross entropy weights the positive term by the ratio of negatives to
# positives, measured over the training split, so that the two classes contribute equally.
# Deaths are roughly one episode in ten, and an unweighted loss over that split rewards
# predicting survival everywhere.
#
# The weighting applies to the validation loss as well. Early stopping selects on it, and
# selecting on an objective other than the one being optimised selects for the wrong thing.
#
# Phenotyping is excluded. It is multi-label, so the same rule sets a separate weight per
# label, and a label at 2% prevalence is then weighted fifty times one at 50%. That ranks
# rare labels above common ones, which is a statement about what the model should be good at
# rather than a correction for imbalance.
FINETUNE_POS_WEIGHT_TASKS:
  - mortality

DISC_LOSS_WEIGHT: 1.0

USE_THP_PRED_LOSS: True
THP_LOSS_MC_SAMPLES: 100

# --- Fixed by decision rather than tuned --------------------------------------------------
#
# OBS_UNOBS_SAMPLE_RATIO at 10.0 is a change from the submitted 5.0: enrich the hard task. It
# composes cleanly with RECORD_MASK_RATIO, which is in the grid -- the record mask ratio sets
# the total masking budget and this sets the observed-to-unobserved mix, so the two do not
# confound.
OBS_UNOBS_SAMPLE_RATIO: 10.0
THP_LOSS_NLL_WEIGHT: 0.01
THP_PRED_LOSS_TYPE_WT: 1.0

# --- Tuned: the first value of each grid, i.e. the centre of the sweep ---------------------
PRETRAIN_LEARNING_RATE: 0.002
PRETRAIN_LEARNING_RATE_DECAY: 0.90
CMPNT_MASK_RATIO: 0.25
RECORD_MASK_RATIO: 0.15
# 0.01 is Zuo et al.'s time_loss/100, replacing the eyeballed 1e-6 that was submitted. Every
# value in the grid is at least 100x the old one, which is the correction the in-stay
# restriction calls for: gaps collapse from ~1e5 h to ~1 h.
THP_PRED_LOSS_TIME_WT: 0.01
