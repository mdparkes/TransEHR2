# N.B. DRUG_FEATS is reserved for the drug embedding features because it requires special handling in the data preprocessing pipeline. Other drug-related features, such as DRUG_INDUCTION_MAINTENANCE and DRUG_STRD_FLARE_DOSE, are handled as VALUED_FEATS.
DRUG_FEATS:
  - DRUG

STATIC_FEATS: []


# Data preprocessing parameters
# Timesteps per episode: the most recent MAX_EPISODE_LEN_STEPS records at
# or before INDEX_TIME (section 4.1). This is T in section 4.4's shapes.
MAX_EPISODE_LEN_STEPS: 500

# Minimum episode length in timesteps. Section 3 sets no minimum, and
# invariant 4 makes every INDEX_TIME name a timeseries.csv row, so this is
# a reported count rather than a filter: extraction cannot drop an episode
# without shifting the fold row indices that index into its output.
MIN_EPISODE_LEN_STEPS: 1

