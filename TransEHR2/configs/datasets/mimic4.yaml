# MIMIC-IV Dataset Configuration
# Configuration file for extracting and preprocessing MIMIC-IV data

# Data directory containing fold subdirectories with CSV listfiles
DATA_DIR: "/uhome/pr3/projects/p60290_2/TransEHR2/data"

# Path to variable properties YAML file
VARIABLE_PROPERTIES_PATH: "/uhome/pr3/projects/p60290_2/TransEHR2/data/variable_properties.yaml"

# Feature definitions
#
# VALUED_FEATS and EVENT_FEATS are not disjoint. A feature named in both reaches the value
# encoder with its measured values and the Hawkes process with its arrival times; the two
# streams are read from one episode timeseries independently, by name. EVENT_FEATS is the
# mark set of the point process, which carries occurrence and time and no magnitude.
VALUED_FEATS:
  - "Albumin"
  - "ALP"
  - "ALT"
  - "Arterial pCO2"
  - "Arterial pH"
  - "Arterial pO2"
  - "AST"
  - "Bicarbonate"
  - "Blood urea nitrogen"
  - "Capillary refill rate"
  - "Diastolic arterial blood pressure"
  - "Fraction inspired oxygen"
  - "GCS eye opening"
  - "GCS motor response"
  - "GCS verbal response"
  - "Glucose"
  - "Heart rate"
  - "Height"
  - "Hematocrit"
  - "Hemoglobin"
  - "Lactate"
  - "Lactate dehydrogenase"
  - "Mean arterial blood pressure"
  - "Platelet count"
  - "Respiration rate"
  - "SaO2"
  - "Serum creatinine"
  - "Serum magnesium"
  - "Serum sodium"
  - "SpO2"
  - "Systolic arterial blood pressure"
  - "Temperature"
  - "Total bilirubin"
  - "Total cholesterol"
